<style>
/* ============================================
   RESET — uklanja default margine i padding
   ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ============================================
   OSNOVNI STIL — font, boje, pozadina cijele stranice
   ============================================ */
body {
  font-family: 'Helvetica Neue', Arial, sans-serif; /* moderan, čist font */
  background: #ffffff;                              /* bijela pozadina */
  color: #111;                                      /* skoro crna slova */
  line-height: 1.6;                                 /* razmak između redova */
}

/* ============================================
   PREBACIVANJE JEZIKA (EN | HR) — fiksirano gore desno
   ============================================ */
.lang-switch {
  position: fixed;              /* ostaje na mjestu dok skrolaš */
  top: 20px;                    /* 20px od vrha */
  right: 30px;                  /* 30px od desne ivice */
  z-index: 100;                 /* iznad svega ostalog */
  display: flex;                /* elementi jedan pored drugog */
  align-items: center;          /* vertikalno poravnanje */
  gap: 8px;                     /* razmak između elemenata */
}

/* Stil dugmadi EN i HR */
.lang-switch button {
  background: none;             /* bez pozadine */
  border: none;                 /* bez okvira */
  color: #888;                  /* siva boja (neaktivno) */
  font-family: inherit;         /* isti font kao tijelo */
  font-size: 12px;
  letter-spacing: 2px;          /* razmak između slova */
  cursor: pointer;              /* kursor ruke na hover */
  padding: 5px 8px;
  text-transform: uppercase;    /* velika slova */
  display: flex;
  align-items: center;
  gap: 6px;                     /* razmak između zastavice i teksta */
  transition: opacity 0.3s;     /* glatka promjena prozirnosti */
}

/* Kad pređeš mišem preko dugmeta */
.lang-switch button:hover {
  opacity: 0.7;
}

/* Aktivno dugme (trenutni jezik) — tamnije i podebljano */
.lang-switch button.active {
  color: #111;
  font-weight: 600;
}

/* Stil zastavica (SVG) */
.lang-switch svg {
  width: 20px;
  height: 14px;
  border-radius: 2px;           /* blago zaobljeni rubovi */
  box-shadow: 0 0 0 1px rgba(0,0,0,0.1); /* tanki okvir oko zastave */
}

/* Vertikalna crta | između EN i HR */
.lang-switch span {
  color: #ddd;
}

/* ============================================
   ZAGLAVLJE — veliki naslov IVONE.PHOTO
   ============================================ */
header {
  padding: 100px 40px 60px;     /* unutrašnji razmak (gore, lijevo/desno, dolje) */
  text-align: center;           /* centrirano */
  border-bottom: 1px solid #eee; /* tanka siva linija ispod */
}

/* Glavni naslov IVONE.PHOTO */
header h1 {
  font-size: 42px;              /* velika slova */
  font-weight: 300;             /* tanka (light) debljina */
  letter-spacing: 8px;          /* široko razmaknuta slova (elegantno) */
  margin-bottom: 10px;
}

/* Podnaslov PHOTOGRAPHY / FOTOGRAFIJA */
header p {
  font-size: 14px;
  letter-spacing: 4px;
  color: #888;                  /* siva boja */
  text-transform: uppercase;    /* VELIKA SLOVA */
}

/* ============================================
   NAVIGACIJA — Portfolio / About / Contact
   ============================================ */
nav {
  text-align: center;
  padding: 30px 0;
}

/* Linkovi u navigaciji */
nav a {
  color: #111;
  text-decoration: none;        /* bez podcrtavanja */
  margin: 0 20px;               /* razmak lijevo i desno */
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* Kad pređeš mišem preko linka */
nav a:hover { 
  opacity: 0.5;                 /* blago se posvijetli */
}

/* ============================================
   UVODNI TEKST — kratki opis ispod navigacije
   ============================================ */
.intro {
  max-width: 700px;             /* ne širi se preko 700px */
  margin: 40px auto;            /* centrirano horizontalno */
  padding: 0 20px;
  text-align: center;
  font-size: 16px;
  color: #555;                  /* srednje siva */
  line-height: 1.8;
}

/* ============================================
   GALERIJA — mreža fotografija (grid 3x3)
   ============================================ */
.gallery {
  display: grid;                              /* CSS Grid raspored */
  grid-template-columns: repeat(3, 1fr);      /* 3 kolone jednake širine */
  gap: 10px;                                  /* razmak između slika */
  padding: 40px 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* Same slike u galeriji */
.gallery img {
  width: 100%;                  /* popuni cijelu širinu kolone */
  height: 300px;                /* fiksna visina */
  object-fit: cover;            /* isiječe sliku da popuni prostor */
  transition: transform 0.5s;   /* glatka animacija pri hover */
  cursor: pointer;
}

/* Kad pređeš mišem preko slike — blago zumira */
.gallery img:hover { 
  transform: scale(1.03); 
}

/* ============================================
   FOOTER — copyright i email na dnu
   ============================================ */
footer {
  text-align: center;
  padding: 60px 20px;
  font-size: 12px;
  letter-spacing: 3px;
  color: #888;
  border-top: 1px solid #eee;   /* tanka linija iznad */
}

footer a { 
  color: #111; 
  text-decoration: none; 
}

/* ============================================
   RESPONSIVE — prilagodba za tablete (do 768px)
   ============================================ */
@media (max-width: 768px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }  /* 2 kolone */
  header h1 { font-size: 28px; letter-spacing: 4px; }  /* manji naslov */
  .lang-switch { top: 15px; right: 15px; }             /* bliže rubu */
}

/* ============================================
   RESPONSIVE — prilagodba za mobitele (do 480px)
   ============================================ */
@media (max-width: 480px) {
  .gallery { grid-template-columns: 1fr; }  /* 1 kolona */
}
</style>
</head>

<!-- ============================================
     JAVASCRIPT — funkcija za prebacivanje jezika
     ============================================ -->
<script>
  // Funkcija koja mijenja jezik na cijeloj stranici
  function setLang(lang) {
    // Pronađi SVE elemente koji imaju data-en i data-hr atribute
    // i postavi im tekst na odgovarajući jezik
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute('data-' + lang);
    });
    
    // Označi aktivno dugme (podebljano)
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-hr').classList.toggle('active', lang === 'hr');
    
    // Postavi HTML lang atribut (za SEO i accessibility)
    document.documentElement.lang = lang;
    
    // Zapamti odabir u browseru (localStorage)
    // Tako da kad klijent ponovno dođe, ostane na njegovom jeziku
    localStorage.setItem('preferred-lang', lang);
  }
  
  // Kad se stranica učita, provjeri je li korisnik već odabrao jezik
  // Ako nije, koristi engleski (default)
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('preferred-lang') || 'en';
    setLang(saved);
  });
</script>
